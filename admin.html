<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Daily Bread</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <h1 class="logo">Daily Bread</h1>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="admin.html" class="admin-link active">Admin</a></li>
            </ul>
        </div>
    </nav>

    <main class="container admin-container">
        <section class="admin-header">
            <h2>Admin Dashboard</h2>
            <div class="admin-controls">
                <button id="resetStats" class="btn btn-danger">Reset All Statistics</button>
                <button id="exportStats" class="btn btn-primary">Export Stats</button>
            </div>
        </section>

        <section class="stats-summary">
            <div class="stat-card">
                <h3>Total Views</h3>
                <p class="stat-number" id="totalViews">0</p>
            </div>
            <div class="stat-card">
                <h3>Total Devotions</h3>
                <p class="stat-number" id="totalDevotions">0</p>
            </div>
            <div class="stat-card">
                <h3>Average Views</h3>
                <p class="stat-number" id="avgViews">0</p>
            </div>
        </section>

        <section class="stats-table">
            <h3>Devotion View Statistics</h3>
            <table id="statsTable">
                <thead>
                    <tr>
                        <th>Devotion Title</th>
                        <th>Author</th>
                        <th>Views</th>
                        <th>Last Viewed</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="statsBody">
                    <!-- Table rows will be populated here -->
                </tbody>
            </table>
        </section>

        <section class="stats-chart">
            <h3>Views by Devotion</h3>
            <div id="chartContainer" class="chart-container">
                <!-- Chart will be rendered here -->
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Daily Bread. All rights reserved.</p>
    </footer>

    <script src="devotions-data.js"></script>
    <script src="admin.js"></script>
</body>
</html>
